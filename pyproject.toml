[project]
name = "pykaryoplot"
version = "0.1.0"
description = "Python port of karyoploteR — customizable linear-genome karyotype plots, rendered with Cairo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Artistic-2.0" }
authors = [{ name = "Jeff Quinn" }]
dependencies = [
    "pycairo>=1.25",
    "numpy>=1.24",
]

[project.optional-dependencies]
pyranges = ["pyranges>=0.0.129"]
pandas = ["pandas>=2.0"]
bam = ["pysam>=0.22"]
bigwig = ["pyBigWig>=0.3.22"]
test = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pykaryoplot"]
